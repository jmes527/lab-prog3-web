<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Programación III - INF-5170</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="vista-login" class="d-none">
    <div class="login-box">
      <div class="card p-4">
        <h3 class="text-center mb-1">Lab Programación III</h3>
        <p class="text-center text-muted">INF-5170 · Iniciar sesión</p>
        <div id="login-error" class="alert alert-danger py-2 d-none"></div>
        <form id="form-login">
          <div class="mb-3"><label class="form-label">Usuario</label>
            <input id="usuario" class="form-control" required autofocus></div>
          <div class="mb-3"><label class="form-label">Contraseña</label>
            <input id="clave" type="password" class="form-control" required></div>
          <button class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- APLICACIÓN (menú dinámico + contenido) -->
  <section id="vista-app" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#inicio">Lab Prog III</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto" id="menu-lista"></ul>
          <span class="navbar-text me-3" id="usuario-actual"></span>
          <button id="btn-salir" class="btn btn-outline-light btn-sm">Salir</button>
        </div>
      </div>
    </nav>
    <main class="container my-4" id="contenido"></main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vistas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
